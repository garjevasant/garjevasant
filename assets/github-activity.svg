<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity dashboard</title>
  <desc id="desc">A reliable local GitHub activity snapshot with links to the live profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#081526"/><stop offset="1" stop-color="#17152B"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#67E8F9" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/><rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="19" stroke="#2DD4BF" stroke-opacity=".35"/>
  <g font-family="Arial, sans-serif"><text x="34" y="43" fill="#67E8F9" font-size="13" font-weight="700" letter-spacing="2">GITHUB ACTIVITY // PROFILE SNAPSHOT</text><text x="34" y="68" fill="#91A8C0" font-size="12">Live repository links are available below. The visual panel is locally rendered for reliability.</text>
    <g transform="translate(34 103)"><rect width="250" height="126" rx="12" fill="#0B2033" stroke="#1D526B"/><text x="22" y="35" fill="#91A8C0" font-size="12">PUBLIC REPOSITORIES</text><text x="22" y="83" fill="#F8FAFC" font-size="38" font-weight="700">9</text><text x="22" y="105" fill="#67E8F9" font-size="11">OPEN PROJECT SPACES</text></g>
    <g transform="translate(306 103)"><rect width="250" height="126" rx="12" fill="#0B2033" stroke="#1D526B"/><text x="22" y="35" fill="#91A8C0" font-size="12">PROFILE FOCUS</text><text x="22" y="83" fill="#F8FAFC" font-size="25" font-weight="700">BUILD / SECURE</text><text x="22" y="105" fill="#FCD34D" font-size="11">SOFTWARE + SIGNALS</text></g>
    <g transform="translate(578 103)"><rect width="250" height="126" rx="12" fill="#0B2033" stroke="#1D526B"/><text x="22" y="35" fill="#91A8C0" font-size="12">PRIMARY STACK</text><text x="22" y="82" fill="#F8FAFC" font-size="25" font-weight="700">DART / PYTHON</text><text x="22" y="105" fill="#67E8F9" font-size="11">FLUTTER · RF · CLOUD</text></g>
    <g transform="translate(850 103)"><rect width="316" height="126" rx="12" fill="#0B2033" stroke="#1D526B"/><text x="22" y="35" fill="#91A8C0" font-size="12">LIVE PROFILE</text><text x="22" y="78" fill="#F8FAFC" font-size="19" font-weight="700">github.com/garjevasant</text><path d="M22 97H270" stroke="url(#line)" stroke-width="3"/><text x="22" y="114" fill="#67E8F9" font-size="11">OPEN PROFILE TO VIEW CURRENT ACTIVITY</text></g>
  </g>
</svg>
