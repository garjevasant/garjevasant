<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mission control telemetry panel</title>
  <desc id="desc">Animated sci-fi telemetry display for Vasant Garje's developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#07111F"/><stop offset="0.52" stop-color="#0C1F35"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#53B5D8" stroke-opacity=".12"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/><rect width="1200" height="420" fill="url(#grid)"/>
    <path d="M0 318H1200" stroke="#67E8F9" stroke-opacity=".12"/><path d="M0 92H1200" stroke="#67E8F9" stroke-opacity=".08"/>
    <g font-family="JetBrains Mono, Space Grotesk, monospace" letter-spacing="2"><text x="42" y="54" fill="#67E8F9" font-size="14">VG // DEVELOPER MISSION CONTROL</text><text x="42" y="82" fill="#94AFC7" font-size="11">BUILD SYSTEMS · SECURE SIGNALS · SHIP WITH PURPOSE</text><text x="1030" y="54" fill="#FDE68A" font-size="11">ONLINE</text><circle cx="1014" cy="50" r="4" fill="#FDE68A"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(160 218)"><circle r="112" stroke="#67E8F9" stroke-opacity=".18"/><circle r="82" stroke="#67E8F9" stroke-opacity=".28" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/></circle><circle r="54" stroke="#FDE68A" stroke-opacity=".36" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/></circle><circle r="16" fill="#0EA5E9" fill-opacity=".18" stroke="#67E8F9"/><circle r="5" fill="#FDE68A" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle><path d="M-112 0H112M0-112V112" stroke="#67E8F9" stroke-opacity=".15"/><path d="M0-112A112 112 0 0 1 80-80" stroke="url(#cyan)" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></path></g>
    <g transform="translate(350 146)" font-family="JetBrains Mono, Space Grotesk, monospace"><text fill="#94AFC7" font-size="11">SIGNAL PROFILE</text><text y="30" fill="#E7F7FF" font-size="24">FULL-STACK / RF</text><text y="58" fill="#67E8F9" font-size="12">ANDROID · PYTHON · SDR · CLOUD</text><path d="M0 92H300" stroke="#23445B"/><path d="M0 92H220" stroke="url(#cyan)" stroke-width="3"><animate attributeName="d" values="M0 92H220;M0 92H270;M0 92H220" dur="3s" repeatCount="indefinite"/></path><text y="132" fill="#94AFC7" font-size="11">CURRENT VECTOR</text><text y="158" fill="#FDE68A" font-size="17">EXPLORE → BUILD → IMPROVE</text></g>
    <g transform="translate(760 126)" font-family="JetBrains Mono, Space Grotesk, monospace"><rect width="380" height="190" rx="12" fill="#06111D" fill-opacity=".56" stroke="#23516B"/><text x="22" y="34" fill="#67E8F9" font-size="11">SYSTEM TELEMETRY</text><text x="22" y="68" fill="#94AFC7" font-size="11">PRODUCT ENGINEERING</text><rect x="22" y="78" width="280" height="5" rx="2" fill="#173348"/><rect x="22" y="78" width="236" height="5" rx="2" fill="url(#cyan)"/><text x="316" y="84" fill="#E7F7FF" font-size="11">84%</text><text x="22" y="116" fill="#94AFC7" font-size="11">SIGNAL PROCESSING</text><rect x="22" y="126" width="280" height="5" rx="2" fill="#173348"/><rect x="22" y="126" width="190" height="5" rx="2" fill="url(#amber)"/><text x="316" y="132" fill="#E7F7FF" font-size="11">68%</text><text x="22" y="164" fill="#94AFC7" font-size="11">SECURITY MINDSET</text><rect x="22" y="174" width="280" height="5" rx="2" fill="#173348"/><rect x="22" y="174" width="252" height="5" rx="2" fill="url(#cyan)"/><text x="316" y="180" fill="#E7F7FF" font-size="11">90%</text></g>
    <rect y="0" width="1200" height="3" fill="#67E8F9" fill-opacity=".6"><animate attributeName="y" values="0;417;0" dur="7s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#67E8F9" stroke-opacity=".35"/>
</svg>
