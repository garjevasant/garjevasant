</defs><style>text{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
.in{opacity:0;animation:en .9s cubic-bezier(.2,.7,.2,1) forwards}@keyframes en{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-9px)}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp 24s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.or,.cs{animation:sp 30s linear infinite}.cs{transform-box:fill-box;transform-origin:center}.rv{animation-direction:reverse}
.dr{animation:dr 7s linear infinite}@keyframes dr{to{transform:translateY(32px)}}
.tr{animation:tr 7s linear infinite}@keyframes tr{to{stroke-dashoffset:-1000}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}@keyframes pu{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:bar 2s ease-in-out infinite}@keyframes bar{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
.gl{animation:gl 2.4s ease-in-out infinite}@keyframes gl{50%{opacity:.25}}
.ro{opacity:0;animation:ro 12s infinite both}@keyframes ro{0%{opacity:0;transform:translateY(12px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-12px)}}
.fw{animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-20}}
.nx{animation:nx 1.6s ease-in-out infinite}@keyframes nx{50%{transform:translateX(6px)}}
.hl{animation:hl 7s infinite}@keyframes hl{0%,12%{fill:#247bff;stroke:#7fb2ff}15%,100%{fill:#0d1526;stroke:#24365a}}
.swp{animation:swp 4.5s ease-in-out infinite}@keyframes swp{0%{transform:translateX(-320px)}60%,100%{transform:translateX(380px)}}
.sway{transform-origin:195px 0;animation:sw 6s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.pg{stroke-dasharray:760;animation:pg 6s ease-in-out infinite}@keyframes pg{0%{stroke-dashoffset:760}70%,100%{stroke-dashoffset:0}}
.scn{animation:scn 2.6s ease-in-out infinite alternate}@keyframes scn{to{transform:translateX(190px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1!important}.ro{opacity:0!important}.r0{opacity:1!important}}</style>
