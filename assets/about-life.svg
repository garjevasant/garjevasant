<g class="in"><text x="48" y="60" font-size="15" font-weight="700" fill="#22d3ee" text-anchor="start" >About the builder</text><text x="48" y="102" font-size="34" font-weight="800" fill="#eef3fb" text-anchor="start" >From disciplined service to practical software.</text><text x="48" y="132" font-size="15" font-weight="400" fill="#9fb0cc" text-anchor="start" >Technical systems, communications, IT and finance, applied to real software.</text></g><path d="M120 196H880" stroke="#1b2a47" stroke-width="4" stroke-linecap="round"/><path class="pg" d="M120 196H880" stroke="url(#gb)" stroke-width="4" stroke-linecap="round"/><circle r="7" fill="#fff"><animateMotion dur="6s" repeatCount="indefinite" path="M120 196H880"/></circle><g class="in" style="animation-delay:0.3s"><circle class="pu" cx="120" cy="196" r="16" fill="#ff6174" style="animation-delay:0.0s"/><circle cx="120" cy="196" r="16" fill="#0d1526" stroke="#ff6174" stroke-width="3"/><circle cx="120" cy="196" r="5" fill="#ff6174"/><text x="120" y="240" font-size="17" font-weight="700" fill="#eef3fb" text-anchor="middle" >Service</text><text x="120" y="260" font-size="12.5" font-weight="400" fill="#9fb0cc" text-anchor="middle" >Indian Army discipline</text></g><g class="in" style="animation-delay:0.5s"><circle class="pu" cx="373" cy="196" r="16" fill="#5da0ff" style="animation-delay:0.6s"/><circle cx="373" cy="196" r="16" fill="#0d1526" stroke="#5da0ff" stroke-width="3"/><circle cx="373" cy="196" r="5" fill="#5da0ff"/><text x="373" y="240" font-size="17" font-weight="700" fill="#eef3fb" text-anchor="middle" >Systems</text><text x="373" y="260" font-size="12.5" font-weight="400" fill="#9fb0cc" text-anchor="middle" >Technical systems and comms</text></g><g class="in" style="animation-delay:0.7s"><circle class="pu" cx="627" cy="196" r="16" fill="#22d3ee" style="animation-delay:1.2s"/><circle cx="627" cy="196" r="16" fill="#0d1526" stroke="#22d3ee" stroke-width="3"/><circle cx="627" cy="196" r="5" fill="#22d3ee"/><text x="627" y="240" font-size="17" font-weight="700" fill="#eef3fb" text-anchor="middle" >IT and finance</text><text x="627" y="260" font-size="12.5" font-weight="400" fill="#9fb0cc" text-anchor="middle" >Systems meet business</text></g><g class="in" style="animation-delay:0.9000000000000001s"><circle class="pu" cx="880" cy="196" r="16" fill="#ffb454" style="animation-delay:1.7999999999999998s"/><circle cx="880" cy="196" r="16" fill="#0d1526" stroke="#ffb454" stroke-width="3"/><circle cx="880" cy="196" r="5" fill="#ffb454"/><text x="880" y="240" font-size="17" font-weight="700" fill="#eef3fb" text-anchor="middle" >Software</text><text x="880" y="260" font-size="12.5" font-weight="400" fill="#9fb0cc" text-anchor="middle" >Web, mobile, AI and RF</text></g><g transform="translate(48 292)"><g class="in" style="animation-delay:0.9s"><rect width="217" height="98" rx="16" fill="#0d1526" stroke="#1f3358"/><clipPath id="t0"><rect width="217" height="98" rx="16"/></clipPath><g clip-path="url(#t0)"><rect class="swp" width="60" height="98" fill="url(#sh)" opacity=".5" style="animation-delay:0.0s"/></g><g transform="translate(34 49)" fill="none" stroke="#5da0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="-16" y="-12" width="26" height="20" rx="3"/><rect x="6" y="-4" width="12" height="18" rx="3" fill="#0d1526"/></g><text x="66" y="46" font-size="13.5" font-weight="700" fill="#eef3fb" text-anchor="start" >Web &amp; mobile apps</text><text x="66" y="66" font-size="11.5" font-weight="400" fill="#9fb0cc" text-anchor="start" >Frontend to Android</text></g></g><g transform="translate(281 292)"><g class="in" style="animation-delay:1.05s"><rect width="217" height="98" rx="16" fill="#0d1526" stroke="#1f3358"/><clipPath id="t1"><rect width="217" height="98" rx="16"/></clipPath><g clip-path="url(#t1)"><rect class="swp" width="60" height="98" fill="url(#sh)" opacity=".5" style="animation-delay:0.7s"/></g><g transform="translate(34 49)" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-10" cy="-8" r="4"/><circle cx="10" cy="-8" r="4"/><circle cy="10" r="4"/><path d="M-10-8L10-8M-10-8L0 10M10-8L0 10"/></g><text x="66" y="46" font-size="13.5" font-weight="700" fill="#eef3fb" text-anchor="start" >Python, CV &amp; AI</text><text x="66" y="66" font-size="11.5" font-weight="400" fill="#9fb0cc" text-anchor="start" >OpenCV and automation</text></g></g><g transform="translate(514 292)"><g class="in" style="animation-delay:1.2s"><rect width="217" height="98" rx="16" fill="#0d1526" stroke="#1f3358"/><clipPath id="t2"><rect width="217" height="98" rx="16"/></clipPath><g clip-path="url(#t2)"><rect class="swp" width="60" height="98" fill="url(#sh)" opacity=".5" style="animation-delay:1.4s"/></g><g transform="translate(34 49)" fill="none" stroke="#ff6174" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0-15L13-10V2C13 10 6 16 0 19C-6 16-13 10-13 2V-10Z"/><path d="M-5 2L-1 6L6-3"/></g><text x="66" y="46" font-size="13.5" font-weight="700" fill="#eef3fb" text-anchor="start" >Security &amp; networks</text><text x="66" y="66" font-size="11.5" font-weight="400" fill="#9fb0cc" text-anchor="start" >Hardening, TCP/UDP</text></g></g><g transform="translate(747 292)"><g class="in" style="animation-delay:1.35s"><rect width="217" height="98" rx="16" fill="#0d1526" stroke="#1f3358"/><clipPath id="t3"><rect width="217" height="98" rx="16"/></clipPath><g clip-path="url(#t3)"><rect class="swp" width="60" height="98" fill="url(#sh)" opacity=".5" style="animation-delay:2.0999999999999996s"/></g><g transform="translate(34 49)" fill="none" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="fw" stroke-dasharray="6 4" d="M-18 0q4.5-14 9 0t9 0t9 0t9 0"/></g><text x="66" y="46" font-size="13.5" font-weight="700" fill="#eef3fb" text-anchor="start" >SDR and RF</text><text x="66" y="66" font-size="11.5" font-weight="400" fill="#9fb0cc" text-anchor="start" >HackRF, FFT, GNU Radio</text></g></g><text x="500" y="424" font-size="14" font-weight="600" fill="#5da0ff" text-anchor="middle" >Tech exploration  •  Continuous learning  •  Turning real needs into tools</text></g>
